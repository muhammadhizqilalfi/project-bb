version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sirekab
    container_name: sirekab-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - sqlite_data:/var/www/database
    networks:
      - app-net

  webserver:
    image: nginx:alpine
    container_name: sirekab-webserver
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-net
    depends_on:
      - app

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_HEADER=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  bot-control:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    image: sirekab-bot
    container_name: sirekab-bot-control
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net
    depends_on:
      - app

networks:
  app-net:
    driver: bridge

volumes:
  sqlite_data:
    driver: local