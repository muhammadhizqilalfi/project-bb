services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: slbb
    container_name: slbb-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.env:/var/www/.env
      - sqlite_data:/var/www/database
      - ./backups:/var/www/database/backups
    networks:
      - app-net

  webserver:
    image: nginx:alpine
    container_name: slbb-webserver
    restart: always
    ports:
      - "8800:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-net
    depends_on:
      - app

  bot-control:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    image: slbb-bot
    container_name: slbb-bot-control
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./telegram_bot:/app
    networks:
      - app-net
    depends_on:
      - app

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: slbb-scheduler
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-db.schedule: "0 0 2 * * *"
      ofelia.job-exec.backup-db.container: "slbb-app"
      ofelia.job-exec.backup-db.command: "sh -c 'mkdir -p /var/www/database/backups && cp /var/www/database/database.sqlite /var/www/database/backups/backup-$(date +%Y%m%d).sqlite && find /var/www/database/backups -type f -name \"*.sqlite\" -mtime +30 -delete'"

networks:
  app-net:
    driver: bridge

volumes:
  sqlite_data:
    driver: local